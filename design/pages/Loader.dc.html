<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f3ee}
*{box-sizing:border-box}
a{color:#257173;text-decoration:none}a:hover{color:#1f2a2a;text-decoration:none}
.gw-root{--gw-display:'Bricolage Grotesque',system-ui,sans-serif;--gw-body:Nunito,system-ui,sans-serif;--gw-track:-0.02em;font-family:var(--gw-body);color:#1f2a2a;background:#f4f3ee;overflow:hidden}
.gw-display{font-family:var(--gw-display,'Bricolage Grotesque',system-ui,sans-serif);letter-spacing:var(--gw-track,-0.02em)}
.gw-wrap{max-width:1240px;margin:0 auto;padding-left:32px;padding-right:32px}
.gw-eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#257173}
.gw-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s ease,background .2s ease}
.gw-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 0 -4px rgba(31,42,42,.18)}
.gw-btn:active{transform:translateY(1px) scale(.98)}
.gw-arrow{display:inline-block;transition:transform .25s ease}
.gw-btn:hover .gw-arrow,.gw-card:hover .gw-arrow{transform:translateX(5px)}
.gw-nav a.gw-link{position:relative;text-decoration:none;color:#1f2a2a}
.gw-nav a.gw-link{transition:color .2s ease}.gw-nav a.gw-link:hover,.gw-nav a.gw-link.on{color:#257173}
@keyframes gw-float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
.gw-float{animation:gw-float 5s ease-in-out infinite}
.gw-float.d2{animation-delay:-1.6s}.gw-float.d3{animation-delay:-3.2s}
@keyframes gw-draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.gw-squiggle path{stroke-dasharray:400;animation:gw-draw 1.4s .4s cubic-bezier(.6,0,.2,1) both}
@keyframes gw-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gw-rise{animation:gw-rise .8s cubic-bezier(.2,.8,.2,1) both}
.gw-rise.d1{animation-delay:.1s}.gw-rise.d2{animation-delay:.22s}.gw-rise.d3{animation-delay:.34s}.gw-rise.d4{animation-delay:.46s}
@keyframes gw-pop{0%{opacity:0;transform:translateY(10px) scale(.94)}100%{opacity:1;transform:none}}
.gw-pop{animation:gw-pop .5s cubic-bezier(.3,1.5,.5,1) both}
.gw-pill{animation:gw-pop .45s cubic-bezier(.3,1.6,.5,1) both;transition:transform .2s ease}
.gw-pill:hover{transform:translateY(-2px) rotate(-1.5deg)}
.gw-card{transition:transform .4s cubic-bezier(.3,1.4,.5,1),box-shadow .3s ease}
.gw-card:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(31,42,42,.45)}
.gw-card .gw-zoom{transition:transform .6s ease}
.gw-card:hover .gw-zoom{transform:scale(1.06)}
.gw-tilt{transition:transform .4s cubic-bezier(.3,1.4,.5,1),box-shadow .3s ease}
.gw-tilt:hover{transform:perspective(900px) rotateX(3deg) rotateY(-4deg) translateY(-6px);box-shadow:0 30px 50px -30px rgba(31,42,42,.45)}
.gw-chip{border:1.5px solid #d8d4c8;background:#fff;color:#1f2a2a;border-radius:999px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s ease,border-color .2s ease}
.gw-chip:hover{transform:translateY(-2px)}
.gw-chip.on{background:#1f2a2a;color:#f4f3ee;border-color:#1f2a2a}
.gw-tab{border:none;background:transparent;text-align:left;cursor:pointer;font-family:inherit;color:#1f2a2a;transition:background .25s ease,transform .25s ease}
.gw-tab:hover{transform:translateX(4px)}
.gw-acc{border:none;background:transparent;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:#1f2a2a}
.gw-acc .gw-plus{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.gw-acc.on .gw-plus{transform:rotate(45deg)}
.gw-flip{perspective:1200px}
.gw-flip-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.gw-flip:hover .gw-flip-in,.gw-flip:focus-within .gw-flip-in{transform:rotateY(180deg)}
.gw-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;overflow:hidden}
.gw-back{transform:rotateY(180deg)}
.gw-step{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.gw-step:hover{transform:translateY(-6px)}
@keyframes gw-path{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gw-path{transform-origin:left;animation:gw-path 1.6s .3s cubic-bezier(.6,0,.2,1) both}
@keyframes gw-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.gw-marquee{animation:gw-marquee 32s linear infinite}
.gw-marquee-wrap:hover .gw-marquee{animation-play-state:paused}
.gw-input{width:100%;font-family:inherit;font-size:17px;color:#1f2a2a;background:#fff;border:1.5px solid #d8d4c8;border-radius:16px;padding:16px 18px;transition:border-color .2s ease,box-shadow .2s ease}
.gw-input:focus{outline:none;border-color:#33999b;box-shadow:0 0 0 4px rgba(51,153,155,.18)}
.gw-jump span{display:inline-block;transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s ease}
.gw-jump span:hover{transform:translateY(-14px) rotate(-4deg);color:#ffe885}
.gw-foot a{color:#f4f3ee;text-decoration:none;opacity:.8;transition:opacity .2s ease}
.gw-foot a:hover{opacity:1;color:#ffe885}
@media (max-width:820px){.gw-stack{grid-template-columns:minmax(0,1fr)!important}.gw-hide-sm{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gw-dd{position:relative}
.gw-dd-btn{background:none;border:none;font:inherit;color:#1f2a2a;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px}
.gw-dd-btn .gw-caret{display:inline-block;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.gw-dd:hover .gw-caret,.gw-dd:focus-within .gw-caret{transform:rotate(180deg)}
.gw-dd-menu{position:absolute;left:50%;top:100%;padding-top:14px;z-index:50;opacity:0;visibility:hidden;transform:translate(-50%,8px);transition:opacity .2s ease,transform .25s cubic-bezier(.3,1.4,.5,1),visibility .2s}
.gw-dd:hover .gw-dd-menu,.gw-dd:focus-within .gw-dd-menu{opacity:1;visibility:visible;transform:translate(-50%,0)}
.gw-dd-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;color:#1f2a2a;transition:background .2s ease,transform .2s ease}
.gw-dd-item:hover{background:#f4f3ee;transform:translateX(3px);color:#1f2a2a}
.gw-dd-btn:hover,.gw-dd-btn.on{color:#257173}

/* ---- Grow Wings loader ---- */
@keyframes gw-speeder{0%{transform:translate(2px,1px) rotate(0deg)}10%{transform:translate(-1px,-3px) rotate(-1deg)}20%{transform:translate(-2px,0) rotate(1deg)}30%{transform:translate(1px,2px) rotate(0deg)}40%{transform:translate(1px,-1px) rotate(1deg)}50%{transform:translate(-1px,3px) rotate(-1deg)}60%{transform:translate(-1px,1px) rotate(0deg)}70%{transform:translate(3px,1px) rotate(-1deg)}80%{transform:translate(-2px,-1px) rotate(1deg)}90%{transform:translate(2px,1px) rotate(0deg)}100%{transform:translate(1px,-2px) rotate(-1deg)}}
@keyframes gw-fazer1{0%{left:0}100%{left:-80px;opacity:0}}
@keyframes gw-fazer2{0%{left:0}100%{left:-100px;opacity:0}}
@keyframes gw-fazer3{0%{left:0}100%{left:-50px;opacity:0}}
@keyframes gw-fazer4{0%{left:0}100%{left:-150px;opacity:0}}
@keyframes gw-lf{0%{left:200%}100%{left:-200%;opacity:0}}
@keyframes gw-lf3{0%{left:200%}100%{left:-100%;opacity:0}}
@keyframes gw-clouds{0%{transform:translateX(0)}100%{transform:translateX(-200vw)}}
@keyframes gw-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes gw-breathe{0%,100%{opacity:1}50%{opacity:.7}}
.gw-ld-flier{position:relative;animation:gw-speeder .4s linear infinite}
.gw-ld-trail{position:absolute;left:-10px;top:34%;width:60px;height:80px}
.gw-ld-trail span{position:absolute;left:0;height:3px;border-radius:3px;background:rgba(255,255,255,.85)}
.gw-ld-trail span:nth-child(1){top:0;width:40px;animation:gw-fazer1 .2s linear infinite}
.gw-ld-trail span:nth-child(2){top:22px;width:56px;animation:gw-fazer2 .4s linear infinite}
.gw-ld-trail span:nth-child(3){top:44px;width:30px;animation:gw-fazer3 .4s linear infinite;animation-delay:-1s}
.gw-ld-trail span:nth-child(4){top:66px;width:46px;animation:gw-fazer4 1s linear infinite;animation-delay:-1s}
.gw-ld-long span{position:absolute;height:2px;width:20%;background:rgba(255,255,255,.55);border-radius:2px}
.gw-ld-long span:nth-child(1){top:20%;animation:gw-lf .6s linear infinite;animation-delay:-5s}
.gw-ld-long span:nth-child(2){top:40%;animation:gw-lf .8s linear infinite;animation-delay:-1s}
.gw-ld-long span:nth-child(3){top:62%;animation:gw-lf3 .6s linear infinite}
.gw-ld-long span:nth-child(4){top:80%;animation:gw-lf3 .5s linear infinite;animation-delay:-3s}
.gw-ld-clouds{position:absolute;inset:0;animation:gw-clouds 26s linear infinite}
.gw-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.16}
.gw-cloud::before,.gw-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.gw-cloud::before{width:55%;height:150%;left:15%;bottom:20%}
.gw-cloud::after{width:40%;height:120%;right:12%;bottom:30%}
.gw-cloud.c1{width:220px;height:60px;top:14%;left:70%}
.gw-cloud.c2{width:160px;height:44px;top:70%;left:110%;opacity:.12}
.gw-cloud.c3{width:280px;height:72px;top:32%;left:150%;opacity:.1}
.gw-cloud.c4{width:180px;height:50px;top:82%;left:30%;opacity:.14}
.gw-cloud.c5{width:240px;height:64px;top:8%;left:190%;opacity:.12}
.gw-ld-title{animation:gw-breathe 2.4s ease-in-out infinite}
.gw-ld-bar{position:relative;display:block;width:180px;height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.gw-ld-bar span{position:absolute;inset:0;width:40%;border-radius:6px;background:#ffe885;animation:gw-bar 1.3s cubic-bezier(.6,0,.4,1) infinite}

</style>
</helmet>
<div class="gw-ld" role="status" aria-live="polite" style="position: relative; width: 100%; height: 100vh; min-height: 560px; background: #33999b; overflow: hidden; font-family: Nunito, system-ui, sans-serif; color: #fff">
  <!-- clouds -->
  <div class="gw-ld-clouds" aria-hidden="true">
    <span class="gw-cloud c1"></span>
    <span class="gw-cloud c2"></span>
    <span class="gw-cloud c3"></span>
    <span class="gw-cloud c4"></span>
    <span class="gw-cloud c5"></span>
  </div>
  <!-- long speed lines across the sky -->
  <div class="gw-ld-long" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- the flier -->
  <div style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 44px">
    <div class="gw-ld-flier" aria-hidden="true">
      <div class="gw-ld-trail"><span></span><span></span><span></span><span></span></div>
      <img src="/_blob/bcd07d5ad57c96ae3f594d79be15dd84" alt="" style="width: 150px; display: block; position: relative">
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span class="gw-ld-title" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.01em">Getting your wings ready</span>
      <span class="gw-ld-bar" aria-hidden="true"><span></span></span>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Loading</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}

</script>
</body>
</html>
